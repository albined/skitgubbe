name: Minimal CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run check
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Run Prettier checks
        run: |
          bunx prettier --check "packages/server/**/*.ts" "packages/shared/**/*.ts" "*.json" "packages/server/*.json" "packages/shared/*.json"
          bun --cwd packages/web run lint
