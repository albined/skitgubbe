services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/skitgubbe.db
      - JWT_SECRET=skitgubbe-super-secret-key-12345 # In production, override this with a secure key in your environment
    volumes:
      - skitgubbe_db_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web
    restart: unless-stopped

volumes:
  skitgubbe_db_data:
